<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mochi Bot Control</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #eef2f5; text-align: center; padding: 20px; color: #333; }
        .container { max-width: 400px; margin: 0 auto; background: white; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); overflow: hidden; }
        .header { background: #6c5ce7; color: white; padding: 25px 20px; }
        .header h1 { margin: 0; font-size: 24px; letter-spacing: 1px; }
        
        /* Status Badge */
        .status-badge { display: inline-block; padding: 6px 12px; border-radius: 20px; font-size: 12px; font-weight: bold; margin-top: 10px; background: #dfe6e9; color: #636e72; transition: 0.3s; }
        .status-online { background: #00b894; color: white; box-shadow: 0 0 10px #00b894; }
        .status-offline { background: #d63031; color: white; }

        .content { padding: 25px; }
        
        /* Buttons */
        .btn { display: block; width: 100%; padding: 16px; margin: 12px 0; border: none; border-radius: 12px; font-size: 16px; font-weight: 600; cursor: pointer; transition: transform 0.1s, opacity 0.2s; color: white; }
        .btn:active { transform: scale(0.98); }
        .btn-sedentary { background: #00b894; }
        .btn-alarm { background: #ff7675; }
        .btn-quote { background: #0984e3; }
        .btn-msg { background: #fdcb6e; color: #2d3436; }
        
        /* Inputs */
        input[type="text"] { width: 100%; padding: 15px; margin-bottom: 5px; border: 2px solid #dfe6e9; border-radius: 10px; box-sizing: border-box; font-size: 16px; text-align: center; }
        input:focus { border-color: #6c5ce7; outline: none; }
        
        .divider { border: 0; border-top: 1px solid #eee; margin: 25px 0; }
        .footer { font-size: 12px; color: #b2bec3; margin-top: 20px; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>Mochi Bot 🤖</h1>
        <div id="statusBadge" class="status-badge">CONNECTING...</div>
    </div>

    <div class="content">
        <!-- Sedentary Toggle -->
        <button id="sedBtn" class="btn btn-sedentary" onclick="toggleSedentary()">
            Sedentary Mode: ...
        </button>

        <div class="divider"></div>

        <!-- Alarm Trigger -->
        <button class="btn btn-alarm" onclick="triggerAlarm()">🚨 RING ALARM NOW</button>

        <!-- Dynamic Quote -->
        <button class="btn btn-quote" onclick="fetchNewQuote()">✨ Send Anime Quote</button>

        <div class="divider"></div>

        <!-- Message -->
        <input type="text" id="msgInput" placeholder="Type a message..." maxlength="18">
        <button class="btn btn-msg" onclick="sendMessage()">📨 Send Message</button>
        
        <p class="footer" id="debugLog">System Ready</p>
    </div>
</div>

<script>
    // ==========================================
    // STEP 1: PASTE YOUR FIREBASE URL BELOW
    // MUST END WITH A SLASH /
    // ==========================================
    const DATABASE_URL = "https://mochi-bot-nexo-default-rtdb.asia-southeast1.firebasedatabase.app/"; 
    // ==========================================

    let currentSedentary = false;
    let lastSeenTime = 0;
    let localCheckTime = 0;

    // --- SYNC WITH FIREBASE (Reads Status) ---
    async function syncState() {
        try {
            const response = await fetch(DATABASE_URL + "mochi_status.json");
            const data = await response.json();
            
            if(data) {
                // 1. Update Buttons
                currentSedentary = data.sedentary_mode;
                const btn = document.getElementById('sedBtn');
                btn.innerText = `Sedentary Mode: ${currentSedentary ? 'ON' : 'OFF'}`;
                btn.style.opacity = currentSedentary ? '1' : '0.5';

                // 2. Check "Last Seen" Heartbeat
                // The ESP32 sends a timestamp (millis) every 30s.
                // If this number changes, the bot is alive.
                const serverTimestamp = data.last_seen; 
                
                if (serverTimestamp !== lastSeenTime) {
                    // It changed! Bot is online.
                    lastSeenTime = serverTimestamp;
                    localCheckTime = Date.now();
                    setStatus(true);
                } else {
                    // Hasn't changed. Is it stale?
                    // If local time > 45s since last change, mark offline.
                    if (Date.now() - localCheckTime > 45000) {
                        setStatus(false);
                    }
                }
            }
        } catch (e) {
            console.log(e);
            setStatus(false);
        }
    }

    function setStatus(isOnline) {
        const badge = document.getElementById('statusBadge');
        const log = document.getElementById('debugLog');
        if (isOnline) {
            badge.className = "status-badge status-online";
            badge.innerText = "ONLINE 🟢";
            log.innerText = "Connected to Mochi";
        } else {
            badge.className = "status-badge status-offline";
            badge.innerText = "OFFLINE 🔴";
            log.innerText = "Mochi is unreachable";
        }
    }

    // --- SEND COMMANDS TO FIREBASE ---
    async function updateFirebase(payload) {
        try {
            await fetch(DATABASE_URL + "mochi_status.json", {
                method: 'PATCH',
                body: JSON.stringify(payload)
            });
            // Force an immediate sync to update UI
            setTimeout(syncState, 200); 
        } catch (e) {
            alert("Error sending command");
        }
    }

    function toggleSedentary() { updateFirebase({ sedentary_mode: !currentSedentary }); }

    function triggerAlarm() {
        updateFirebase({ trigger_alarm: true });
        // Auto-reset the trigger after 3s so it can be rung again
        setTimeout(() => updateFirebase({ trigger_alarm: false }), 3000);
    }

    function sendMessage() {
        const msg = document.getElementById('msgInput').value;
        if(!msg) return;
        updateFirebase({ message: msg });
        document.getElementById('msgInput').value = "";
        // Clear message after 5s
        setTimeout(() => updateFirebase({ message: "" }), 5000);
    }

    async function fetchNewQuote() {
        document.getElementById('debugLog').innerText = "Fetching Quote...";
        try {
            const res = await fetch('https://animechan.xyz/api/random');
            const data = await res.json();
            updateFirebase({
                trigger_quote: true,
                quote_text: data.quote,
                quote_char: data.character,
                quote_anime: data.anime
            });
            setTimeout(() => updateFirebase({ trigger_quote: false }), 5000);
        } catch(e) {
            // Fallback if API is down
            updateFirebase({
                trigger_quote: true,
                quote_text: "I will become the God of this world!",
                quote_char: "Light Yagami",
                quote_anime: "Death Note"
            });
        }
    }

    // Poll every 3 seconds to check status
    setInterval(syncState, 3000);
    syncState(); // Run immediately on load

</script>
</body>
</html>
